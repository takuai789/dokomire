<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="どこみれ" />
<meta name="theme-color" content="#F2F2F7" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F5A524'/%3E%3Cstop offset='1' stop-color='%231E3A5F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='34' font-family='Arial,sans-serif' font-size='42' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3ED%3C/text%3E%3C/svg%3E" />
<title>どこみれ</title>
<style>
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --fill: rgba(118,118,128,.12);
    --ink: #1C1C1E; --muted: rgba(60,60,67,.6); --tertiary: rgba(60,60,67,.3); --sep: rgba(60,60,67,.18);
    --accent: #1E3A5F; --accent-soft: #E3EAF3; --gold: #F5A524;
    --ok: #16A34A; --ok-soft: #E3F5E9; --ltd: #D97706; --ltd-soft: #FDF0DC; --no: #8E8E93; --red: #FF3B30;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sf); color: var(--ink); font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }
  /* iPhoneの定石：見えている範囲にぴったり固定 */
  #app { position: fixed; left: 0; right: 0; top: var(--app-top, 0px); height: var(--app-height, 100%); display: flex; flex-direction: column; padding-top: var(--safe-top); max-width: 720px; margin: 0 auto; }
  .view { display: none; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 28px; }
  .view.on { display: block; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 10px; }
  .top h1 { font-size: 32px; font-weight: 700; }
  .top .add { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 22px; line-height: 36px; margin-bottom: 4px; }
  .search { width: 100%; border: 0; background: var(--fill); border-radius: 10px; padding: 9px 12px; font-size: 16px; margin-bottom: 10px; }
  .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 7px 4px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .sec { font-size: 13px; color: var(--muted); font-weight: 500; margin: 16px 4px 6px; display: flex; justify-content: space-between; }
  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: .5px solid var(--sep); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:active { background: var(--fill); }
  .row-main { flex: 1; min-width: 0; }
  .row-t { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chev { color: var(--tertiary); font-size: 20px; }
  .kind { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 2px 7px; }
  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.ltd { color: var(--ltd); background: var(--ltd-soft); }
  .chip.mine { color: #fff; }
  .chip.ok.mine { background: var(--ok); }
  .chip.ltd.mine { background: var(--ltd); }
  .chip.none { color: var(--no); background: var(--fill); }
  .watch-now { font-size: 12px; font-weight: 700; color: var(--ok); white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.8; padding: 40px 16px; }
  .legend { font-size: 12px; color: var(--muted); margin: 8px 4px 0; line-height: 1.6; }
  /* サブスク */
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
  .sum .box { background: var(--card); border-radius: 12px; padding: 12px 14px; }
  .sum .l { font-size: 13px; color: var(--muted); font-weight: 500; }
  .sum .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .sum .v small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .sum .box.wide { grid-column: 1 / -1; }
  .price { text-align: right; font-variant-numeric: tabular-nums; }
  .price b { font-size: 17px; font-weight: 600; }
  .price small { display: block; font-size: 12px; color: var(--muted); }
  .soon { color: var(--ltd); font-weight: 700; }
  .btn-row { display: block; width: 100%; text-align: left; padding: 13px 14px; color: var(--accent); font-size: 17px; background: var(--card); border-radius: 12px; margin-top: 10px; }
  /* タブバー */
  .tabbar { flex-shrink: 0; display: flex; background: rgba(249,249,251,.94); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: .5px solid var(--sep); padding-bottom: var(--safe-bottom); }
  body.keyboard-open .tabbar { display: none; }
  .tabbar button { flex: 1; padding: 7px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: #8E8E93; }
  .tabbar button.on { color: var(--accent); }
  .tabbar svg { width: 26px; height: 26px; }
  /* シート */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-bg.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); max-width: 720px; margin: 0 auto; max-height: calc(var(--app-height, 100vh) - var(--safe-top) - 16px); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px calc(var(--safe-bottom) + 20px); z-index: 61; transform: translateY(105%); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  body.keyboard-open .sheet { padding-bottom: 16px; }
  .sheet.show { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); margin: 0 auto 10px; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sh-head h2 { font-size: 17px; font-weight: 600; }
  .sh-close { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--muted); font-size: 17px; }
  .fld-l { display: block; font-size: 13px; color: var(--muted); margin: 14px 4px 6px; }
  .fld { width: 100%; border: 0; background: var(--card); border-radius: 10px; padding: 12px 14px; font-size: 17px; }
  textarea.fld { resize: vertical; min-height: 60px; line-height: 1.5; }
  .fld-row { display: flex; gap: 8px; align-items: center; }
  .fld-row .fld { flex: 1; min-width: 0; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 10px; padding: 10px 14px; font-size: 17px; }
  .sw { width: 51px; height: 31px; border-radius: 16px; background: #E9E9EA; position: relative; transition: background .2s; flex-shrink: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .sw.on { background: var(--ok); }
  .sw.on::after { transform: translateX(20px); }
  .srow { background: var(--card); padding: 10px 14px; border-bottom: .5px solid var(--sep); }
  .srow:last-child { border-bottom: 0; }
  .srow-top { display: flex; align-items: center; gap: 8px; }
  .srow-name { flex: 1; font-size: 16px; font-weight: 500; min-width: 0; }
  .mine-tag { font-size: 10.5px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 5px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .tri { display: inline-flex; background: var(--fill); border-radius: 8px; padding: 2px; }
  .tri button { font-size: 12.5px; font-weight: 600; padding: 6px 9px; border-radius: 6px; color: var(--muted); }
  .tri button.on.ok { background: var(--ok); color: #fff; }
  .tri button.on.limited { background: var(--ltd); color: #fff; }
  .tri button.on.no { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .memo { width: 100%; border: 0; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 16px; margin-top: 8px; }
  .primary { width: 100%; margin-top: 18px; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; }
  .danger { width: 100%; margin-top: 8px; padding: 13px; border-radius: 12px; background: var(--card); color: var(--red); font-size: 17px; }
  .hist { background: var(--card); border-radius: 10px; overflow: hidden; }
  .hrow { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: .5px solid var(--sep); font-size: 15px; }
  .hrow:last-child { border-bottom: 0; }
  .hrow .x { color: var(--tertiary); font-size: 16px; padding: 0 4px; }
  .note { font-size: 12.5px; color: var(--muted); margin: 6px 4px 0; line-height: 1.6; }
  #toast { position: fixed; left: 50%; top: calc(var(--safe-top) + 14px); transform: translateX(-50%); background: rgba(28,28,30,.94); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; z-index: 9000; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #updateBanner { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 70px); z-index: 1000; display: flex; justify-content: center; background: var(--accent); color: #fff; border-radius: 14px; padding: 14px 18px; font-size: 15px; font-weight: 600; box-shadow: 0 8px 28px rgba(0,0,0,.2); transform: translateY(200%); transition: transform .35s cubic-bezier(.32,.72,0,1); }
  #updateBanner.show { transform: none; }
</style>
</head>
<body>
<div id="app">
  <div class="view on" id="worksView"></div>
  <div class="view" id="subsView"></div>
  <div class="view" id="setView"></div>
  <nav class="tabbar">
    <button data-tab="worksView" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M10 9.5v5l4-2.5z" fill="currentColor"/></svg>作品</button>
    <button data-tab="subsView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>サブスク</button>
    <button data-tab="setView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</button>
  </nav>
</div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none" />

<script>
  const APP_VERSION = '2.0.0';
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayStr = () => ymd(new Date());
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const mdw = (s) => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; };
  const yen = (n) => '¥' + Math.round(n).toLocaleString('ja-JP');
  let toastT = 0;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

  // ---------- IndexedDB（名前・形式は v1 のまま。項目を足しただけ） ----------
  const DB_NAME = 'dokomire-db', DB_VERSION = 1, STORES = ['works', 'services'];
  let _db = null;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => { const db = req.result; for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }
  const tx = (store, mode = 'readonly') => _db.transaction(store, mode).objectStore(store);
  const getAll = (store) => new Promise((res, rej) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const put = (store, val) => new Promise((res, rej) => { const r = tx(store, 'readwrite').put(val); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  const del = (store, id) => new Promise((res, rej) => { const r = tx(store, 'readwrite').delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });

  // works:    { id, title, kind?, statuses: { [serviceId]: { s:'ok'|'limited'|'no', memo } }, note?, createdAt, updatedAt }
  // services: { id, name, enabled, order, subscribed?, price?, cycle?:'month'|'year', nextRenew?, payment?, memo?, history?:[{type:'start'|'stop',date}], updatedAt }
  const PRESETS = ['Netflix', 'Amazon Prime Video', 'U-NEXT', 'Disney+', 'Hulu', 'ABEMA', 'Apple TV+', 'DMM TV', 'Lemino', 'TVer'];
  const KINDS = ['映画', 'ドラマ', 'アニメ', 'その他'];
  const state = { works: [], services: [], tab: 'worksView', query: '', filter: 'all' };

  async function loadAll() {
    state.works = await getAll('works');
    state.services = await getAll('services');
    if (!state.services.length) {
      state.services = PRESETS.map((name, i) => ({ id: uid(), name, enabled: true, order: i, updatedAt: Date.now() }));
      for (const s of state.services) await put('services', s);
    }
    state.services.sort((a, b) => (a.order || 0) - (b.order || 0));
    state.works.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ja'));
  }
  // 作品の画面に出すサービス（契約中は常に出す）
  const shownServices = () => state.services.filter((s) => s.enabled !== false || s.subscribed);
  const serviceById = (id) => state.services.find((s) => s.id === id);
  const workById = (id) => state.works.find((w) => w.id === id);
  const statusOf = (w, sid) => (w.statuses && w.statuses[sid] && w.statuses[sid].s) || '';
  const watchable = (w) => shownServices().filter((s) => ['ok', 'limited'].includes(statusOf(w, s.id)));
  const watchableMine = (w) => watchable(w).filter((s) => s.subscribed);
  const favCountFor = (s) => state.works.filter((w) => ['ok', 'limited'].includes(statusOf(w, s.id))).length;
  const monthly = (s) => s.price ? (s.cycle === 'year' ? s.price / 12 : s.price) : 0;
  // 次の更新日：過ぎていたら周期ぶん先へ送って表示する
  function nextRenew(s) {
    if (!s.nextRenew) return null;
    const base = parse(s.nextRenew), day = base.getDate(), t = parse(todayStr());
    let d = new Date(base), guard = 0;
    while (d < t && guard++ < 600) {
      if (s.cycle === 'year') d.setFullYear(d.getFullYear() + 1);
      else { d = new Date(d.getFullYear(), d.getMonth() + 1, 1); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
    }
    return ymd(d);
  }
  const daysTo = (s) => Math.round((parse(s) - parse(todayStr())) / 86400000);

  // ---------- 作品タブ ----------
  function renderWorks() {
    const q = state.query.trim().toLowerCase();
    let items = state.works.slice();
    if (q) items = items.filter((w) => (w.title || '').toLowerCase().includes(q));
    if (state.filter === 'mine') items = items.filter((w) => watchableMine(w).length);
    if (state.filter === 'none') items = items.filter((w) => !watchable(w).length);
    const counts = { all: state.works.length, mine: state.works.filter((w) => watchableMine(w).length).length, none: state.works.filter((w) => !watchable(w).length).length };
    const rows = items.map((w) => {
      const ws = watchable(w);
      const chips = ws.length
        ? ws.map((s) => `<span class="chip ${statusOf(w, s.id) === 'ok' ? 'ok' : 'ltd'}${s.subscribed ? ' mine' : ''}">${esc(s.name)}${statusOf(w, s.id) === 'limited' ? '・制限' : ''}</span>`).join('')
        : '<span class="chip none">いまはどこにもない</span>';
      const now = watchableMine(w).length ? '<span class="watch-now">今みれる</span>' : '';
      return `<div class="row" data-work="${w.id}"><div class="row-main"><div class="row-t">${esc(w.title || '（無題）')}${w.kind ? `<span class="kind">${esc(w.kind)}</span>` : ''}</div><div class="chips">${chips}</div></div>${now}<span class="chev">›</span></div>`;
    }).join('');
    $('#worksView').innerHTML = `
      <div class="top"><h1>どこみれ</h1><button class="add" data-addwork aria-label="作品を追加">＋</button></div>
      <input class="search" id="search" type="search" placeholder="作品を探す" value="${esc(state.query)}" autocomplete="off">
      <div class="seg">${[['all', 'すべて'], ['mine', '契約中でみれる'], ['none', 'どこにもない']].map(([k, l]) => `<button data-filter="${k}" class="${state.filter === k ? 'on' : ''}">${l} ${counts[k]}</button>`).join('')}</div>
      ${items.length ? `<div class="list">${rows}</div><div class="legend">色の濃いサービスは契約中。「今みれる」は契約中のどれかで見られる作品です。</div>`
        : `<div class="empty">${state.works.length ? '条件に合う作品がありません' : '右上の＋から、お気に入りの作品を<br>追加してみましょう'}</div>`}`;
    const s = $('#search');
    s.addEventListener('input', () => { state.query = s.value; const pos = s.selectionStart; renderWorks(); const n = $('#search'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} });
  }

  function openWorkSheet(id) {
    let w = id ? workById(id) : null;
    const isNew = !w;
    if (isNew) w = { id: uid(), title: '', kind: '', statuses: {}, note: '', createdAt: Date.now(), updatedAt: Date.now() };
    const draft = JSON.parse(JSON.stringify(w));
    draft.statuses = draft.statuses || {};
    const svc = shownServices().slice().sort((a, b) => (b.subscribed ? 1 : 0) - (a.subscribed ? 1 : 0));
    let first = true;
    const draw = () => {
      const rows = svc.map((s) => {
        const st = (draft.statuses[s.id] || {}).s || '';
        return `<div class="srow" data-sid="${s.id}"><div class="srow-top"><span class="srow-name">${esc(s.name)}${s.subscribed ? '<span class="mine-tag">契約中</span>' : ''}</span>
          <span class="tri">${[['ok', 'みれる'], ['limited', '制限あり'], ['no', 'みれない']].map(([k, l]) => `<button data-st="${k}" class="${k} ${st === k ? 'on' : ''}">${l}</button>`).join('')}</span></div>
          ${st === 'limited' ? `<input class="memo" data-memo="${s.id}" placeholder="別料金・期間限定など" value="${esc((draft.statuses[s.id] || {}).memo || '')}" autocomplete="off">` : ''}</div>`;
      }).join('');
      openSheet(`<div class="sh-head"><h2>${isNew ? '作品を追加' : '作品'}</h2><button class="sh-close" data-close>×</button></div>
        <label class="fld-l">タイトル</label><input class="fld" id="wTitle" placeholder="作品のタイトル" value="${esc(draft.title)}" autocomplete="off" autocorrect="off" spellcheck="false">
        <label class="fld-l">種類</label><div class="seg" id="wKind" style="margin-bottom:0">${KINDS.map((k) => `<button data-kind="${k}" class="${draft.kind === k ? 'on' : ''}">${k}</button>`).join('')}</div>
        <label class="fld-l">どこでみれる？（タップで選ぶ・もう一度で取り消し）</label><div class="list">${rows}</div>
        <label class="fld-l">メモ（任意）</label><textarea class="fld" id="wNote" placeholder="好きなところ、誰と見たいかなど" autocomplete="off">${esc(draft.note || '')}</textarea>
        <button class="primary" id="wSave">保存</button>
        ${isNew ? '' : '<button class="danger" id="wDel">この作品を削除</button>'}`, isNew && first);
      first = false;
      const sh = $('#sheet');
      sh.querySelector('#wTitle').addEventListener('input', (e) => { draft.title = e.target.value; });
      sh.querySelector('#wNote').addEventListener('input', (e) => { draft.note = e.target.value; });
      sh.querySelector('#wKind').addEventListener('click', (e) => { const b = e.target.closest('[data-kind]'); if (!b) return; draft.kind = draft.kind === b.dataset.kind ? '' : b.dataset.kind; sh.querySelectorAll('[data-kind]').forEach((x) => x.classList.toggle('on', x.dataset.kind === draft.kind)); });
      sh.querySelectorAll('[data-st]').forEach((b) => b.addEventListener('click', () => {
        const sid = b.closest('.srow').dataset.sid, cur = draft.statuses[sid] || {};
        if (cur.s === b.dataset.st) delete draft.statuses[sid]; else draft.statuses[sid] = { s: b.dataset.st, memo: cur.memo || '' };
        const top = sh.scrollTop; draw(); $('#sheet').scrollTop = top;
      }));
      sh.querySelectorAll('[data-memo]').forEach((m) => m.addEventListener('input', () => { draft.statuses[m.dataset.memo].memo = m.value; }));
      sh.querySelector('#wSave').addEventListener('click', async () => {
        if (!draft.title.trim()) { toast('タイトルを入れてください'); return; }
        draft.title = draft.title.trim(); draft.updatedAt = Date.now();
        await put('works', draft); await loadAll(); closeSheet(); renderAll(); toast(isNew ? '追加しました' : '保存しました');
      });
      const d = sh.querySelector('#wDel');
      if (d) d.addEventListener('click', async () => { if (!(await ask(`「${draft.title}」を削除しますか？`, '削除する'))) return; await del('works', draft.id); await loadAll(); closeSheet(); renderAll(); });
    };
    draw();
  }

  // ---------- サブスクタブ ----------
  function renderSubs() {
    const svc = state.services;
    const mine = svc.filter((s) => s.subscribed);
    const others = svc.filter((s) => !s.subscribed && s.enabled !== false);
    const hidden = svc.filter((s) => !s.subscribed && s.enabled === false);
    const total = mine.reduce((a, s) => a + monthly(s), 0);
    const upcoming = mine.map((s) => ({ s, d: nextRenew(s) })).filter((x) => x.d).sort((a, b) => a.d.localeCompare(b.d))[0];
    const row = (s) => {
      const nr = s.subscribed ? nextRenew(s) : null;
      const favs = favCountFor(s);
      const lastStop = (s.history || []).filter((h) => h.type === 'stop').map((h) => h.date).sort().pop();
      const sub = s.subscribed
        ? [nr ? `次の更新 ${mdw(nr)}${daysTo(nr) <= 7 ? `<span class="soon">（あと${daysTo(nr)}日）</span>` : ''}` : '更新日 未設定', s.payment ? esc(s.payment) : '', `お気に入り${favs}本`].filter(Boolean).join(' ・ ')
        : [`お気に入り${favs}本みれる`, lastStop ? `${mdw(lastStop)}に解約` : ''].filter(Boolean).join(' ・ ');
      const price = s.subscribed && s.price ? `<div class="price"><b>${yen(s.price)}</b><small>${s.cycle === 'year' ? '年額' : '月額'}</small></div>` : '';
      return `<div class="row" data-svc="${s.id}"><div class="row-main"><div class="row-t">${esc(s.name)}</div><div class="row-sub">${sub}</div></div>${price}<span class="chev">›</span></div>`;
    };
    $('#subsView').innerHTML = `
      <div class="top"><h1>サブスク</h1></div>
      <div class="sum">
        <div class="box"><div class="l">契約中</div><div class="v">${mine.length}<small>件</small></div></div>
        <div class="box"><div class="l">ひと月あたり</div><div class="v">${yen(total)}</div></div>
        <div class="box wide"><div class="l">1年あたり ${yen(total * 12)}${upcoming ? `　・　次の更新は <b>${esc(upcoming.s.name)}</b> ${mdw(upcoming.d)}（あと${daysTo(upcoming.d)}日）` : ''}</div></div>
      </div>
      <div class="sec"><span>契約中</span></div>
      ${mine.length ? `<div class="list">${mine.map(row).join('')}</div>` : '<div class="list"><div class="row" style="cursor:default"><div class="row-sub">契約しているサービスを開いて「契約中」をオンにしてください</div></div></div>'}
      <div class="sec"><span>契約していない</span></div>
      <div class="list">${others.map(row).join('')}</div>
      ${hidden.length ? `<div class="sec"><span>作品の画面に出さないサービス</span></div><div class="list">${hidden.map(row).join('')}</div>` : ''}
      <button class="btn-row" data-addsvc>＋ サービスを追加</button>`;
  }

  function openSvcSheet(id) {
    const orig = id ? serviceById(id) : null;
    const isNew = !orig;
    const s = orig ? JSON.parse(JSON.stringify(orig)) : { id: uid(), name: '', enabled: true, order: state.services.length, subscribed: false, price: 0, cycle: 'month', nextRenew: '', payment: '', memo: '', history: [], updatedAt: Date.now() };
    s.history = s.history || [];
    const wasSub = !!s.subscribed;
    let first = true;
    const draw = () => {
      const hist = s.history.slice().sort((a, b) => b.date.localeCompare(a.date));
      openSheet(`<div class="sh-head"><h2>${isNew ? 'サービスを追加' : esc(s.name)}</h2><button class="sh-close" data-close>×</button></div>
        <label class="fld-l">サービス名</label><input class="fld" id="sTitle" value="${esc(s.name)}" placeholder="例：Netflix" autocomplete="off" autocorrect="off" spellcheck="false">
        <label class="fld-l">契約</label><div class="toggle-row"><span>契約中</span><button class="sw ${s.subscribed ? 'on' : ''}" id="sSub" aria-label="契約中"></button></div>
        ${s.subscribed ? `
        <label class="fld-l">料金</label><div class="fld-row"><input class="fld" id="sPrice" type="number" inputmode="numeric" value="${s.price || ''}" placeholder="例：1490" autocomplete="off"><div class="seg" id="sCycle" style="margin:0;flex:0 0 140px">${[['month', '月額'], ['year', '年額']].map(([k, l]) => `<button data-cyc="${k}" class="${(s.cycle || 'month') === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
        <label class="fld-l">次の更新日（過ぎたら自動で次の回に進めて表示します）</label><input class="fld" id="sRenew" type="date" value="${esc(s.nextRenew || '')}">
        <label class="fld-l">支払い方法</label><input class="fld" id="sPay" value="${esc(s.payment || '')}" placeholder="例：楽天カード、Apple経由" autocomplete="off">` : ''}
        <label class="fld-l">メモ（任意）</label><textarea class="fld" id="sMemo" placeholder="プラン名・解約の条件など" autocomplete="off">${esc(s.memo || '')}</textarea>
        <label class="fld-l">契約・解約の記録</label>
        <div class="hist">${hist.length ? hist.map((h) => `<div class="hrow"><span>${h.type === 'start' ? '契約' : '解約'}　${parse(h.date).getFullYear()}/${mdw(h.date)}</span><button class="x" data-hdel="${h.type}|${h.date}">✕</button></div>`).join('') : '<div class="hrow" style="color:var(--muted)">「契約中」を切り替えて保存すると、その日付で記録されます</div>'}</div>
        <label class="fld-l">表示</label><div class="toggle-row"><span>作品の画面に出す</span><button class="sw ${s.enabled !== false ? 'on' : ''}" id="sShow" aria-label="作品の画面に出す"></button></div>
        <div class="note">オフにすると、作品の「どこでみれる？」の一覧から外れます（契約中のものは常に出ます）。</div>
        <button class="primary" id="sSave">保存</button>
        ${isNew ? '' : '<button class="danger" id="sDel">このサービスを削除</button>'}`, isNew && first);
      first = false;
      const sh = $('#sheet');
      const keep = () => {
        s.name = sh.querySelector('#sTitle').value;
        s.memo = sh.querySelector('#sMemo').value;
        if (sh.querySelector('#sPrice')) { s.price = Number(sh.querySelector('#sPrice').value) || 0; s.nextRenew = sh.querySelector('#sRenew').value; s.payment = sh.querySelector('#sPay').value; }
      };
      sh.querySelector('#sSub').addEventListener('click', () => { keep(); s.subscribed = !s.subscribed; draw(); });
      sh.querySelector('#sShow').addEventListener('click', (e) => { keep(); s.enabled = s.enabled === false; e.currentTarget.classList.toggle('on', s.enabled !== false); });
      const cyc = sh.querySelector('#sCycle');
      if (cyc) cyc.addEventListener('click', (e) => { const b = e.target.closest('[data-cyc]'); if (!b) return; s.cycle = b.dataset.cyc; cyc.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); });
      sh.querySelectorAll('[data-hdel]').forEach((b) => b.addEventListener('click', () => { keep(); const [t, d] = b.dataset.hdel.split('|'); s.history = s.history.filter((h) => !(h.type === t && h.date === d)); draw(); }));
      sh.querySelector('#sSave').addEventListener('click', async () => {
        keep();
        if (!s.name.trim()) { toast('サービス名を入れてください'); return; }
        s.name = s.name.trim();
        // 契約中の切り替えを、その日付で記録
        if (s.subscribed !== wasSub) s.history.push({ type: s.subscribed ? 'start' : 'stop', date: todayStr() });
        s.updatedAt = Date.now();
        await put('services', s); await loadAll(); closeSheet(); renderAll(); toast('保存しました');
      });
      const d = sh.querySelector('#sDel');
      if (d) d.addEventListener('click', async () => {
        if (!(await ask(`「${s.name}」を削除しますか？\n作品ごとの「みれる」の記録からも外れます。`, '削除する'))) return;
        await del('services', s.id); await loadAll(); closeSheet(); renderAll();
      });
    };
    draw();
  }

  // ---------- 設定タブ ----------
  const BK_KEY = 'dokomire.lastBackupAt', SCHEMA = 'dokomire.v1';
  function bkText() { let t = 0; try { t = Number(localStorage.getItem(BK_KEY) || 0); } catch (e) {} if (!t) return 'まだ一度もバックアップしていません'; const d = Math.floor((Date.now() - t) / 86400000); return d === 0 ? '前回のバックアップ：今日' : '前回のバックアップから ' + d + '日'; }
  function renderSet() {
    $('#setView').innerHTML = `
      <div class="top"><h1>設定</h1></div>
      <div class="sec"><span>バックアップ</span></div>
      <div class="list"><div class="row" id="exportBtn"><div class="row-main"><div class="row-t" style="color:var(--accent)">データを書き出す（バックアップ）</div></div></div>
      <div class="row" id="importBtn"><div class="row-main"><div class="row-t" style="color:var(--accent)">データを取り込む</div></div></div></div>
      <div class="note">${bkText()}。データはこの端末の中だけにあります。</div>
      <div class="note" style="text-align:center;margin-top:30px">どこみれ v${APP_VERSION}</div>`;
    $('#exportBtn').onclick = exportData;
    $('#importBtn').onclick = () => $('#importFile').click();
  }
  function bkAskSaved() {
    return new Promise((resolve) => {
      const bg = document.createElement('div');
      bg.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
      bg.innerHTML = '<div style="width:100%;max-width:330px;background:#fff;color:#1c1c1e;border-radius:18px;padding:20px 20px 12px;box-shadow:0 12px 40px rgba(0,0,0,.2)"><div style="font-size:16px;font-weight:700;margin-bottom:6px">バックアップは保存できましたか？</div><div style="font-size:14px;line-height:1.6;color:#6e6e73">保存できていれば、前回のバックアップ日を更新します。</div><div style="display:flex;justify-content:flex-end;gap:4px;margin-top:12px"><button data-v="0" style="border:0;background:none;font:inherit;font-size:15px;padding:10px 12px;color:#6e6e73">やめた</button><button data-v="1" style="border:0;background:none;font:inherit;font-size:15px;font-weight:700;padding:10px 12px;color:#007aff">保存できた</button></div></div>';
      bg.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (!b) return; bg.remove(); resolve(b.dataset.v === '1'); });
      document.body.appendChild(bg);
    });
  }
  async function bkSave(text) {
    const d = new Date(), name = `どこみれ_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
    if (navigator.maxTouchPoints > 0) {
      try { const file = new File([text], name, { type: 'application/json' }); if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'ok'; } }
      catch (e) { if (e && e.name === 'AbortError') return (await bkAskSaved()) ? 'ok' : 'cancel'; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'ok';
  }
  async function exportData() {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), works: state.works, services: state.services };
    if (await bkSave(JSON.stringify(data, null, 2)) !== 'ok') return;
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {}
    renderSet(); toast('書き出しました');
  }
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.schema !== SCHEMA) { toast('どこみれのデータではないようです'); return; }
      let n = 0;
      for (const [store, list] of [['works', data.works], ['services', data.services]]) {
        const cur = new Map((await getAll(store)).map((x) => [x.id, x]));
        for (const it of (list || [])) { const l = cur.get(it.id); if (!l || (it.updatedAt || 0) > (l.updatedAt || 0)) { await put(store, it); n++; } }
      }
      await loadAll(); renderAll(); toast(n + '件 取り込みました');
    } catch (err) { toast('取り込めませんでした'); }
  });

  // ---------- 共通：シート・確認 ----------
  function openSheet(html, focusFirst) {
    const sh = $('#sheet'); const was = sh.classList.contains('show');
    sh.innerHTML = '<div class="grab"></div>' + html;
    if (!was) sh.scrollTop = 0;
    $('#sheetBg').classList.add('show');
    if (!was) requestAnimationFrame(() => sh.classList.add('show'));
    sh.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeSheet));
    if (focusFirst) { const f = sh.querySelector('input.fld'); if (f) setTimeout(() => f.focus(), 300); }
  }
  function closeSheet() { $('#sheet').classList.remove('show'); $('#sheetBg').classList.remove('show'); if (document.activeElement) document.activeElement.blur(); }
  $('#sheetBg').addEventListener('click', closeSheet);
  function ask(msg, yes) {
    return new Promise((res) => {
      const bg = document.createElement('div');
      bg.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
      bg.innerHTML = `<div style="width:100%;max-width:300px;background:#fff;border-radius:14px;overflow:hidden;text-align:center"><div style="padding:18px 16px;font-size:15px;line-height:1.55;white-space:pre-line">${esc(msg)}</div><div style="display:flex;border-top:.5px solid rgba(60,60,67,.29)"><button data-v="0" style="flex:1;padding:12px;font-size:17px;color:#007aff">やめる</button><button data-v="1" style="flex:1;padding:12px;font-size:17px;font-weight:600;color:#FF3B30;border-left:.5px solid rgba(60,60,67,.29)">${esc(yes || 'OK')}</button></div></div>`;
      bg.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (!b) return; bg.remove(); res(b.dataset.v === '1'); });
      document.body.appendChild(bg);
    });
  }

  // ---------- 操作 ----------
  function switchTab(id) {
    state.tab = id;
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === id));
    document.querySelectorAll('.tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
    $('#' + id).scrollTop = 0;
  }
  $('.tabbar').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) switchTab(b.dataset.tab); });
  document.addEventListener('click', (e) => {
    if (e.target.closest('#sheet')) return;
    const t = e.target.closest('[data-work],[data-addwork],[data-filter],[data-svc],[data-addsvc]');
    if (!t) return;
    if (t.dataset.work) return openWorkSheet(t.dataset.work);
    if (t.hasAttribute('data-addwork')) return openWorkSheet(null);
    if (t.dataset.filter) { state.filter = t.dataset.filter; return renderWorks(); }
    if (t.dataset.svc) return openSvcSheet(t.dataset.svc);
    if (t.hasAttribute('data-addsvc')) return openSvcSheet(null);
  });
  function renderAll() { renderWorks(); renderSubs(); renderSet(); }

  // ---------- キーボード対策（iPhoneの定石） ----------
  (function () {
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement; let baseH = vv.height, lastH = -1, lastT = -1, lastK = -1;
    function apply() {
      const h = Math.round(vv.height), t = Math.max(0, Math.round(vv.offsetTop)), k = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      if (h !== lastH) { root.style.setProperty('--app-height', h + 'px'); lastH = h; }
      if (t !== lastT) { root.style.setProperty('--app-top', t + 'px'); lastT = t; }
      if (k !== lastK) { root.style.setProperty('--kb', k + 'px'); lastK = k; }
      document.body.classList.toggle('keyboard-open', h < baseH - 120);
    }
    let until = 0, looping = false;
    function follow(ms) { until = Math.max(until, performance.now() + ms); if (looping) return; looping = true; const tick = () => { apply(); const a = document.activeElement; const typing = a && /^(INPUT|TEXTAREA)$/.test(a.tagName); if (typing || performance.now() < until) requestAnimationFrame(tick); else looping = false; }; requestAnimationFrame(tick); }
    vv.addEventListener('resize', () => follow(600)); vv.addEventListener('scroll', () => follow(600));
    document.addEventListener('focusin', (e) => { follow(1200); const el = e.target; if (el && el.closest && el.closest('#sheet') && el.type !== 'date') [350, 700].forEach((ms) => setTimeout(() => { if (document.activeElement === el) { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} } }, ms)); });
    document.addEventListener('focusout', () => follow(1200));
    apply();
  })();

  // ---------- 起動・自動アップデート ----------
  (async () => {
    await openDB(); await loadAll(); renderAll();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  })();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => { const sw = reg.installing; if (!sw) return; sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); }); });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(waitingSW) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button'); b.id = 'updateBanner'; b.textContent = '新しいバージョンがあります — タップで更新';
    b.onclick = () => { b.disabled = true; b.textContent = '更新中…'; waitingSW.postMessage('SKIP_WAITING'); };
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
